
<html>
<head>
    <title>Responsive Retail Website</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #555;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .content {
            flex: 3;
            background: #f2f2f2;
            padding: 25px;
        }

        .sidebar {
            flex: 1;
            background: #ddd;
            padding: 25px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .product {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 20px;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                gap: 15px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .container {
                padding: 10px;
            }

            .products {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>My Retail Store</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <section class="content">
        <h2>Our Products</h2>

        <div class="products">
            <div class="product">Laptop</div>
            <div class="product">Mobile Phone</div>
            <div class="product">Headphones</div>
        </div>
    </section>

    <aside class="sidebar">
        <h3>Special Offers</h3>
        <p>Up to 30% discount!</p>
    </aside>

</div>

<footer>
    <p>© 2026 My Retail Store</p>
</footer>

</body>
</html>
