<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout Debugging</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        .main {
            flex: 2;
            padding: 20px;
            border: 2px solid #ccc;
        }

        .sidebar {
            flex: 1;
            padding: 20px;
            border: 2px solid #ccc;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            padding: 20px;
            border: 1px solid #999;
            background: #f5f5f5;
        }

        footer {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Tablet and Mobile */
        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .main,
            .sidebar {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>CSS Layout Debugging</h1>
</header>

<div class="container">

    <main class="main">

        <h2>Main Content</h2>

        <div class="cards">

            <div class="card">
                <h3>Card 1</h3>
                <p>Product information.</p>
            </div>

            <div class="card">
                <h3>Card 2</h3>
                <p>Product information.</p>
            </div>

            <div class="card">
                <h3>Card 3</h3>
                <p>Product information.</p>
            </div>

            <div class="card">
                <h3>Card 4</h3>
                <p>Product information.</p>
            </div>

        </div>

    </main>

    <aside class="sidebar">
        <h3>Sidebar</h3>
        <p>Additional information.</p>
    </aside>

</div>

<footer>
    <p>Footer Section</p>
</footer>

</body>
</html>
