<!DOCTYPE html>
<html>
<head>
<style>
.product {
    width: 220px;
    padding: 15px;
    margin: 30px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 10px;
    transition: transform 0.3s ease,
                box-shadow 0.3s ease;
}

.product img {
    width: 100%;
}

.product:hover {
    transform: translateY(-8px);
    box-shadow: 0 8px 20px #aaa;
}
</style>
</head>

<body>

<div class="product">
    <img src="shoe.jpg" alt="Sports Shoe">
    <h3>Sports Shoe</h3>
    <p>₹1999</p>
    <button>Buy Now</button>
</div>

</body>
</html>
