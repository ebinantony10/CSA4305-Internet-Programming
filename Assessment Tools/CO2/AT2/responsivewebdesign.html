<!DOCTYPE html>
<html>
<head>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    line-height: 1.6;
}

header {
    padding: 20px;
    text-align: center;
    background: #eee;
}

.container {
    padding: 15px;
}

article {
    margin-bottom: 20px;
}

img {
    max-width: 100%;
    height: auto;
}

.sidebar {
    padding: 15px;
    background: #f5f5f5;
}

footer {
    text-align: center;
    padding: 15px;
}
</style>
</head>

<body>

<header>
    <h1>My Blog</h1>
</header>

<div class="container">

    <main>
        <article>
            <h2>Responsive Web Design</h2>
            <p>By John | August 4, 2026</p>

            <img src="web.jpg" alt="Responsive web design">

            <p>
                Responsive web design allows websites to work
                effectively on different screen sizes.
            </p>
        </article>
    </main>

    <aside class="sidebar">
        <h3>Related Posts</h3>
        <p>CSS Flexbox</p>
        <p>CSS Grid</p>
    </aside>

</div>

<footer>
    Copyright 2026
</footer>

</body>
</html>s
