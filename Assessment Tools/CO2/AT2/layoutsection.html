<!DOCTYPE html>
<html>
<head>
<style>
.dashboard {
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-rows: 70px 1fr;
    height: 100vh;
}

.header {
    grid-column: 1 / 3;
    background: lightblue;
    text-align: center;
    padding: 20px;
}

.sidebar {
    background: lightgray;
    padding: 20px;
}

.main {
    background: white;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    padding: 30px;
    background: lightgreen;
    text-align: center;
}

.chart {
    margin-top: 20px;
    padding: 50px;
    background: lightyellow;
    text-align: center;
}

@media (max-width: 600px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    .header,
    .sidebar,
    .main {
        grid-column: 1;
    }

    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="dashboard">

    <header class="header">
        <h2>Header</h2>
    </header>

    <aside class="sidebar">
        <h3>Sidebar</h3>
    </aside>

    <main class="main">
        <h2>Dashboard Cards</h2>

        <div class="cards">
            <div class="card">C1</div>
            <div class="card">C2</div>
        </div>

        <div class="chart">
            Chart
        </div>
    </main>

</div>

</body>
</html>
